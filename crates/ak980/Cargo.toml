[package]
name = "ak980"
description = "Command line and background agent for the AJAZZ AK980 V2 keyboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "ak980"
path = "src/main.rs"

[dependencies]
ak980-core.workspace = true
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "string"] }
serde_json.workspace = true
libc.workspace = true
