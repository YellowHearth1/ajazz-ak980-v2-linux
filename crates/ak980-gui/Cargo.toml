[package]
name = "ak980-gui"
description = "Window for configuring the AJAZZ AK980 V2 keyboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "ak980-gui"
path = "src/main.rs"

[dependencies]
ak980-core.workspace = true
serde_json.workspace = true
iced = { version = "0.14", default-features = false, features = [
    "wgpu", "tiny-skia", "crisp", "canvas", "image-without-codecs", "tokio",
    "linux-theme-detection", "wayland", "x11",
] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }
