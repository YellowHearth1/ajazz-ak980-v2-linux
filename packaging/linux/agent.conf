# Settings of the Ajazz AK980 V2 system service (ak980 agent --system).
# The per-user agent reads ~/.config/ak980/config.json instead.

# Screen page sent with the time, as the vendor app does.
clock_slot = 1

# Minutes between clock syncs. The clock is also synced when the keyboard
# connects, after sleep, at midnight and when the time or time zone changes.
sync_interval_min = 60
