name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the AppImage
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          packaging/appimage/build.sh
      - name: Source archive
        run: make dist
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$1 == "##" && $2 == v {on = 1; next} $1 == "##" {on = 0} on' CHANGELOG.md > notes.md
          test -s notes.md
          # "## 0.0.2 — 2026-10-30 (pre-release)" publishes a pre-release
          if grep -E "^## $v .*pre-release" CHANGELOG.md; then echo "pre=true" >> "$GITHUB_OUTPUT"; else echo "pre=false" >> "$GITHUB_OUTPUT"; fi
      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          name: Ajazz AK980 V2 | Software for Linux ${{ github.ref_name }}
          body_path: notes.md
          prerelease: ${{ steps.notes.outputs.pre == 'true' }}
          files: |
            dist/*.AppImage
            dist/*.tar.gz

  # Packages for Arch, Artix and derivatives, installed with `pacman -U`
  arch-packages:
    needs: appimage
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the packages
        run: |
          pacman -Syu --noconfirm --needed base-devel cargo git github-cli
          useradd -m builder
          make dist
          cp dist/*.tar.gz packaging/arch/
          chown -R builder .
          # The tagged commit's own archive: the files GitHub's archive of the tag holds
          su builder -c "cd packaging/arch && makepkg --noconfirm -f --skipchecksums"
          ls -l packaging/arch/*.pkg.tar.zst
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" packaging/arch/*.pkg.tar.zst --clobber --repo "$GITHUB_REPOSITORY"
