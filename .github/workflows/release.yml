name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Build the AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}     # the API lookup of the Python runtime
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1
          packaging/appimage/build.sh
      - name: Source archive
        run: make dist
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$1 == "##" && $2 == v {on = 1; next} $1 == "##" {on = 0} on' \
            CHANGELOG.md > notes.md
          test -s notes.md
      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          name: Ajazz AK980 V2 | Software for Linux ${{ github.ref_name }}
          body_path: notes.md
          files: |
            dist/*.AppImage
            dist/*.tar.gz
