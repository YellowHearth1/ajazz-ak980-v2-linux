name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: dinit, so that the tests check the service descriptions with dinit's own checker
        run: sudo apt-get update && sudo apt-get install -y dinit || echo "no dinit package here; those tests are skipped"
      - name: Tests
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The Python implementation of 0.0.1: the reference the Rust parity tests are checked against
  python-reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install . pytest pyflakes
      - name: Lint
        run: python -m pyflakes ak980 tests tools
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  arch-package:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the package from this commit
        run: |
          pacman -Syu --noconfirm --needed base-devel cargo git
          useradd -m builder
          make dist
          cp dist/*.tar.gz packaging/arch/
          chown -R builder .
          # This commit's tarball, not the release archive the checksum is for
          su builder -c "cd packaging/arch && makepkg --noconfirm -f --skipchecksums"
          ls -l packaging/arch/*.pkg.tar.zst
